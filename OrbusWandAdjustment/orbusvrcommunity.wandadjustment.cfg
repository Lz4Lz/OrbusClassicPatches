## Settings file was created by plugin Orbus Classic/Preborn Wand Adjustment v1.4.0
## Plugin GUID: orbusvrcommunity.wandadjustment

[Lend A Hand]

## Tilts the off hands aim axis up/down (positive = down)
# Setting type: Single
# Default value: 0
Rotation X = 0

## Turns the off hands aim axis left/right (positive = right)
# Setting type: Single
# Default value: 0
Rotation Y = 0

## Roll around the aim axis. Leave at zero, recommended. (nose still points the same way)
# Setting type: Single
# Default value: 0
Rotation Z = 0

[Server Aim]

## Adjust the controller rotation sent to the server so Ice Lance / Super go where your adjusted wand points (recommended true, leave default)
# Setting type: Boolean
# Default value: true
Align Server Aim = true

## Adjust the sent hand position so the server wand tip is where the wand tip really is. (recommended true, leave default)
# Setting type: Boolean
# Default value: true
Align Server Position = true

## Auto = detect from headset (recommended). Steam = force Vive/Index values. Rift = force Oculus/Rift values.
# Setting type: String
# Default value: Auto
Server Rig Type = Auto

[Wand Offset]

## Local X offset of the wand relative to the hand
# Setting type: Single
# Default value: 0
Position X = 0

## Local Y offset of the wand relative to the hand
# Setting type: Single
# Default value: 0
Position Y = 0

## Local Z offset of the wand relative to the hand
# Setting type: Single
# Default value: 0
Position Z = 0

## Local X rotation (degrees)
# Setting type: Single
# Default value: 79.1
Rotation X = 79.1

## Local Y rotation (degrees)
